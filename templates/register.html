{{template "head" .}}
{{template "nav" .}}

<section class="auth-section">
  <div class="auth-container reveal">

    <div class="auth-card glass">

      <div class="auth-header">
        <span class="logo-icon">💬</span>
        <h2>Join GlobalChat</h2>
        <p>Free to join. Start earning today.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('signup', this)">
          Sign Up
        </button>

        <button class="auth-tab" onclick="switchTab('login', this)">
          Login
        </button>
      </div>

      <!-- SIGNUP FORM (Native HTML POST to /register) -->
      <form class="auth-form" id="signup" action="/register" method="POST">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" id="fullname" placeholder="Your full name" required />
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label>Phone (M-Pesa)</label>
          <input type="tel" name="phone" id="phone" placeholder="0712345678" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" id="password" placeholder="Min. 8 characters" required />
        </div>

        <div class="form-check">
          <input type="checkbox" id="terms" required />
          <label for="terms">
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn-primary btn-full">
          Continue To Screening →
        </button>

      </form>

      <!-- LOGIN FORM (Native HTML POST to /login) -->
      <form class="auth-form hidden" id="login" action="/login" method="POST">

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" id="loginEmail" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" id="loginPassword" placeholder="Your password" required />
        </div>

        <div class="form-row-between">
          <label class="form-check">
            <input type="checkbox" /> Remember me
          </label>
          <a href="#" class="link-small">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary btn-full">
          Login
        </button>

      </form>

      <div class="security-badges">
        <span>🔒 SSL Secured</span>
        <span>✅ Verified Platform</span>
        <span>🛡️ GDPR Compliant</span>
      </div>

    </div>

  </div>
</section>

<script>
  function switchTab(tabId, button) {
    document.querySelectorAll(".auth-form").forEach(form => {
      form.classList.add("hidden");
    });

    document.getElementById(tabId).classList.remove("hidden");

    document.querySelectorAll(".auth-tab").forEach(tab => {
      tab.classList.remove("active");
    });

    button.classList.add("active");
  }
</script>

<style>
  .auth-section {
    padding: 80px 20px;
  }

  .auth-container {
    max-width: 480px;
    margin: auto;
  }

  .auth-card {
    padding: 40px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
  }

  .auth-header {
    text-align: center;
    margin-bottom: 30px;
  }

  .logo-icon {
    font-size: 42px;
  }

  .auth-tabs {
    display: flex;
    margin-bottom: 30px;
    gap: 10px;
  }

  .auth-tab {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #1e1e1e;
    color: white;
  }

  .auth-tab.active {
    background: #00b894;
  }

  .auth-form.hidden {
    display: none;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    margin-bottom: 8px;
  }

  .form-group input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #111;
    color: white;
  }

  .form-check {
    margin-bottom: 20px;
    font-size: 14px;
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #00b894;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  .form-row-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .security-badges {
    margin-top: 30px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
  }
</style>

{{template "footer" .}}
