{{template "head" .}}
{{template "nav" .}}

<section class="auth-section">
  <div class="auth-container reveal">

    <div class="auth-card glass">

      <div class="auth-header">
        <span class="logo-icon">💬</span>
        <h2>Join GlobalChat</h2>
        <p>Free to join. Start earning today.</p>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" onclick="switchTab('signup', this)">
          Sign Up
        </button>

        <button type="button" class="auth-tab" onclick="switchTab('login', this)">
          Login
        </button>
      </div>

      <!-- SIGNUP FORM -->
      <form class="auth-form" id="signup" action="/register" method="POST" novalidate>

        <div class="form-group">
          <label for="fullname">Full Name</label>

          <input type="text" name="name" id="fullname" placeholder="Your full name" minlength="2" maxlength="100"
            autocomplete="name" required />

          <small class="field-error" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>

          <input type="email" name="email" id="email" placeholder="you@example.com" maxlength="254" autocomplete="email"
            required />

          <small class="field-error" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="phone">Phone (M-Pesa)</label>

          <input type="tel" name="phone" id="phone" placeholder="+254712345678" autocomplete="tel" maxlength="20"
            required />

          <small class="field-hint">
            Example: +254712345678 or 0712345678
          </small>

          <small class="field-error" id="phoneError"></small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input type="password" name="password" id="password" placeholder="Min. 8 characters" minlength="8"
            maxlength="128" autocomplete="new-password" required />

          <small class="field-error" id="passwordError"></small>
        </div>

        <div class="form-check terms-check">
          <input type="checkbox" id="terms" name="terms" value="on" required />

          <label for="terms">
            I agree to the
            <a href="#">Terms of Service</a>
            and
            <a href="#">Privacy Policy</a>
          </label>
        </div>

        <small class="field-error" id="termsError"></small>

        <button type="submit" class="btn-primary btn-full" id="signupButton">
          Continue To Screening →
        </button>

      </form>

      <!-- LOGIN FORM -->
      <form class="auth-form hidden" id="login" action="/login" method="POST">

        <div class="form-group">
          <label for="loginEmail">Email Address</label>

          <input type="email" name="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"
            required />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>

          <input type="password" name="password" id="loginPassword" placeholder="Your password"
            autocomplete="current-password" required />
        </div>

        <div class="form-row-between">
          <label class="form-check remember-check">
            <input type="checkbox" name="remember" value="on" />
            Remember me
          </label>

          <a href="#" class="link-small">
            Forgot password?
          </a>
        </div>

        <button type="submit" class="btn-primary btn-full">
          Login
        </button>

      </form>

      <div class="security-badges">
        <span>🔒 SSL Secured</span>
        <span>✅ Verified Platform</span>
        <span>🛡️ GDPR Compliant</span>
      </div>

    </div>

  </div>
</section>

<script>
  function switchTab(tabId, button) {
    document.querySelectorAll(".auth-form").forEach(form => {
      form.classList.add("hidden");
    });

    const selectedForm = document.getElementById(tabId);

    if (selectedForm) {
      selectedForm.classList.remove("hidden");
    }

    document.querySelectorAll(".auth-tab").forEach(tab => {
      tab.classList.remove("active");
    });

    button.classList.add("active");
  }

  function cleanPhone(value) {
    return value
      .trim()
      .replace(/[\s()-]/g, "");
  }

  function isValidPhone(value) {
    const phone = cleanPhone(value);

    // Kenya local format.
    if (/^(07|01)\d{8}$/.test(phone)) {
      return true;
    }

    // East African international formats.
    return /^\+(254|256|255|250|257|211)\d{7,9}$/.test(phone);
  }

  function isValidName(value) {
    const name = value.trim();

    if (name.length < 2 || name.length > 100) {
      return false;
    }

    // Allows letters, spaces, apostrophes and hyphens.
    return /^[A-Za-zÀ-ÖØ-öø-ÿ' -]+$/.test(name);
  }

  function isValidEmail(value) {
    const email = value.trim();

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function showError(id, message) {
    const element = document.getElementById(id);

    if (element) {
      element.textContent = message;
    }
  }

  function clearErrors() {
    document.querySelectorAll(".field-error").forEach(element => {
      element.textContent = "";
    });
  }

  document
    .getElementById("signup")
    .addEventListener("submit", function (event) {

      clearErrors();

      const name = document
        .getElementById("fullname")
        .value
        .trim();

      const email = document
        .getElementById("email")
        .value
        .trim();

      const phone = document
        .getElementById("phone")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value;

      const terms = document
        .getElementById("terms")
        .checked;

      let valid = true;

      // NAME
      if (!isValidName(name)) {
        showError(
          "nameError",
          "Enter a valid full name."
        );

        valid = false;
      }

      // EMAIL
      if (!isValidEmail(email)) {
        showError(
          "emailError",
          "Enter a valid email address."
        );

        valid = false;
      }

      // PHONE
      if (!isValidPhone(phone)) {
        showError(
          "phoneError",
          "Enter a valid East African phone number."
        );

        valid = false;
      }

      // PASSWORD
      if (password.length < 8) {
        showError(
          "passwordError",
          "Password must contain at least 8 characters."
        );

        valid = false;
      }

      // TERMS
      if (!terms) {
        showError(
          "termsError",
          "You must agree to the Terms and Privacy Policy."
        );

        valid = false;
      }

      if (!valid) {
        event.preventDefault();
        return;
      }

      const button = document.getElementById("signupButton");

      button.disabled = true;
      button.textContent = "Creating Account...";

    });
</script>

<style>
  .auth-section {
    padding: 80px 20px;
  }

  .auth-container {
    max-width: 480px;
    margin: auto;
  }

  .auth-card {
    padding: 40px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
  }

  .auth-header {
    text-align: center;
    margin-bottom: 30px;
  }

  .logo-icon {
    font-size: 42px;
  }

  .auth-tabs {
    display: flex;
    margin-bottom: 30px;
    gap: 10px;
  }

  .auth-tab {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #1e1e1e;
    color: white;
  }

  .auth-tab.active {
    background: #00b894;
  }

  .auth-form.hidden {
    display: none;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    margin-bottom: 8px;
  }

  .form-group input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #111;
    color: white;
    box-sizing: border-box;
  }

  .form-group input:focus {
    outline: none;
    border-color: #00b894;
  }

  .form-check {
    margin-bottom: 10px;
    font-size: 14px;
  }

  .terms-check {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .terms-check input,
  .remember-check input {
    margin-top: 3px;
    flex-shrink: 0;
  }

  .terms-check label {
    line-height: 1.5;
  }

  .field-hint {
    display: block;
    margin-top: 6px;
    color: #999;
    font-size: 12px;
  }

  .field-error {
    display: block;
    min-height: 16px;
    margin-top: 5px;
    color: #ff7675;
    font-size: 12px;
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #00b894;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  .btn-primary:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .form-row-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .remember-check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0;
  }

  .security-badges {
    margin-top: 30px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
  }
</style>

{{template "footer" .}}
